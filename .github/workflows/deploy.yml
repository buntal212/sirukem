name: Deploy Rowo PWA

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rowo-pwa
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. Clean old build
      # ==========================================
      - name: Clean old build
        run: rm -rf dist

      # ==========================================
      # 5. Build Quasar PWA
      # ==========================================
      - name: Build Quasar PWA
        run: npx quasar build -m pwa

      # ==========================================
      # 6. Detect build directory
      # ==========================================
      - name: Detect Quasar build directory
        id: build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== BUILD OUTPUT ==="

          if [ ! -d "dist" ]; then
            echo "ERROR: Folder dist tidak ditemukan!"
            exit 1
          fi

          find dist -maxdepth 3 -type f | head -50 || true

          if [ -f "dist/pwa/index.html" ]; then
            BUILD_DIR="dist/pwa"

          elif [ -f "dist/pwa/www/index.html" ]; then
            BUILD_DIR="dist/pwa/www"

          elif [ -f "dist/spa/index.html" ]; then
            BUILD_DIR="dist/spa"

          else
            echo "ERROR: index.html tidak ditemukan!"
            find dist -name index.html || true
            exit 1
          fi

          echo "Build directory: $BUILD_DIR"
          echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

          echo "=== BUILD CONTENT ==="
          ls -lah "$BUILD_DIR"

      # ==========================================
      # 7. Validate build
      # ==========================================
      - name: Validate build
        shell: bash
        env:
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: |
          set -euo pipefail

          test -f "$BUILD_DIR/index.html"
          test -f "$BUILD_DIR/sw.js"
          test -f "$BUILD_DIR/manifest.json"

          echo "Build validation successful."
          echo "Source: $BUILD_DIR"

          if [ "$BUILD_DIR" = "dist/spa" ]; then
            echo "::warning::Output berada di dist/spa. Periksa konfigurasi PWA dan service worker."
          fi

      # ==========================================
      # 8. Setup SSH
      # ==========================================
      - name: Setup SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H -p "$SERVER_PORT" \
            "$SERVER_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ==========================================
      # 9. Prepare temporary directory
      # ==========================================
      - name: Prepare temporary directory
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /tmp/rowo-pwa-deploy"

      # ==========================================
      # 10. Upload build via rsync
      # ==========================================
      - name: Upload PWA to temporary directory
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: |
          set -euo pipefail

          echo "Uploading from: $BUILD_DIR"

          rsync -az --delete \
            -e "ssh -p $SERVER_PORT" \
            "$BUILD_DIR/" \
            "$SERVER_USER@$SERVER_HOST:/tmp/rowo-pwa-deploy/"

          echo "Upload completed."

      # ==========================================
      # 11. Verify uploaded files
      # ==========================================
      - name: Verify uploaded PWA
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "test -f /tmp/rowo-pwa-deploy/index.html \
              && test -f /tmp/rowo-pwa-deploy/sw.js \
              && test -f /tmp/rowo-pwa-deploy/manifest.json"

          echo "Upload verification successful."

      # ==========================================
      # 12. Deploy to aaPanel
      # ==========================================
      - name: Deploy to aaPanel web root
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo rsync -a --delete \
              --chown=www:www \
              --exclude='.user.ini' \
              --exclude='.well-known/' \
              --exclude='.htaccess' \
              --exclude='404.html' \
              --exclude='502.html' \
              /tmp/rowo-pwa-deploy/ \
              /www/wwwroot/rowo.udumbara.my.id/ \
              && rm -rf /tmp/rowo-pwa-deploy"

          echo "Deployment completed."

      # ==========================================
      # 13. Verify deployment
      # ==========================================
      - name: Verify deployed index.html
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: |
          set -euo pipefail

          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "test -f /www/wwwroot/rowo.udumbara.my.id/index.html \
              && test -f /www/wwwroot/rowo.udumbara.my.id/sw.js \
              && test -f /www/wwwroot/rowo.udumbara.my.id/manifest.json"

          HASH_LOKAL="$(sha256sum "$BUILD_DIR/sw.js" | awk '{print $1}')"
          HASH_SERVER="$(ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "sha256sum /www/wwwroot/rowo.udumbara.my.id/sw.js | awk '{print \$1}'")"

          test "$HASH_LOKAL" = "$HASH_SERVER"

          echo "Deployed PWA files verified."

      # ==========================================
      # 14. Finish
      # ==========================================
      - name: Deployment completed
        run: |
          echo "======================================"
          echo " SI RUKEM DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Website: https://rowo.udumbara.my.id"
